<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asteroides Móvil - Versión Táctil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #0a0f1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            touch-action: none;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            max-height: 800px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(74, 111, 165, 0.7);
            background: #0a0f1e;
            margin: auto;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1f2e, #0a0f1e);
            touch-action: none;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            z-index: 10;
            pointer-events: none;
        }

        .ui-element {
            background: rgba(0,0,0,0.8);
            padding: 6px 10px;
            border-radius: 20px;
            border: 1px solid #4a6fa5;
            backdrop-filter: blur(5px);
            color: white;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .power-bar-container {
            position: absolute;
            top: 10px;
            right: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            padding: 8px;
            border: 2px solid #4a6fa5;
            backdrop-filter: blur(5px);
            pointer-events: none;
            z-index: 10;
        }

        .power-bar-label {
            color: white;
            font-size: 11px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .power-bar {
            width: 100%;
            height: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            gap: 2px;
        }

        .power-segment {
            flex: 1;
            height: 100%;
            border-radius: 4px;
            transition: all 0.3s;
            opacity: 0.2;
            background: #4a6fa5;
        }

        .power-segment.active {
            opacity: 1;
            box-shadow: 0 0 10px currentColor;
        }

        .power-info {
            color: white;
            font-size: 11px;
            margin-top: 4px;
            text-align: center;
            padding: 3px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
        }

        #difficultyMeter {
            position: absolute;
            bottom: 100px;
            right: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            padding: 8px;
            border: 2px solid #ff44aa;
            backdrop-filter: blur(5px);
            z-index: 10;
            pointer-events: none;
        }

        .difficulty-bar {
            width: 100%;
            height: 12px;
            background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000);
            border-radius: 6px;
            margin-top: 4px;
            position: relative;
        }

        .difficulty-indicator {
            position: absolute;
            width: 3px;
            height: 20px;
            background: white;
            top: -4px;
            transform: translateX(-50%);
            border-radius: 2px;
            box-shadow: 0 0 10px white;
        }

        .mode-indicator {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 6px 12px;
            border-radius: 20px;
            border: 2px solid #00ffaa;
            color: #00ffaa;
            font-size: 12px;
            font-weight: bold;
            backdrop-filter: blur(5px);
            z-index: 10;
            pointer-events: none;
        }

        #controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }

        .control-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(74, 111, 165, 0.9);
            border: 3px solid #4a6fa5;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.1s;
            user-select: none;
            font-weight: bold;
        }

        .control-btn:active {
            transform: scale(0.9);
            background: #6b8fc5;
            border-color: #ffaa00;
        }

        .control-btn.missile {
            background: rgba(255, 107, 107, 0.9);
            border-color: #ff6b6b;
        }

        .control-btn.missile:active {
            background: #ff8a8a;
            border-color: #ffaa00;
        }

        #joystickArea {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 120px;
            height: 120px;
            background: rgba(0,0,0,0.5);
            border-radius: 60px;
            border: 2px solid #4a6fa5;
            backdrop-filter: blur(5px);
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        #joystick {
            width: 50px;
            height: 50px;
            background: rgba(74, 111, 165, 0.9);
            border-radius: 25px;
            border: 2px solid white;
            transition: transform 0.05s;
            pointer-events: none;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            color: white;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            display: none;
            border: 3px solid #ff6b6b;
            z-index: 30;
            box-shadow: 0 0 50px rgba(255,107,107,0.5);
            width: 80%;
            max-width: 300px;
        }

        #gameOver h2 {
            margin: 0 0 15px 0;
            color: #ff6b6b;
            font-size: 36px;
        }

        #finalScore {
            font-size: 24px;
            margin-bottom: 10px;
            color: #4a6fa5;
        }

        #finalStats {
            font-size: 14px;
            margin-bottom: 20px;
            color: #aaa;
            line-height: 1.6;
        }

        #restartBtn {
            background: #4a6fa5;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid #6b8fc5;
            font-weight: bold;
            width: 100%;
            touch-action: manipulation;
        }

        #restartBtn:active {
            background: #6b8fc5;
            transform: scale(0.95);
        }

        #orientation-warning {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0f1e;
            color: white;
            display: none;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 100;
            font-size: 18px;
        }

        @media (orientation: portrait) {
            #orientation-warning {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div id="orientation-warning">
        Por favor, gira tu dispositivo a horizontal para jugar
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="450" height="800"></canvas>
        
        <div id="ui">
            <div class="ui-element" id="score">🎯 0</div>
            <div class="ui-element" id="lives">❤️ 3</div>
            <div class="ui-element" id="missiles">🚀 0</div>
            <div class="ui-element" id="powerLevel">⚡ 0/6</div>
        </div>

        <div class="power-bar-container">
            <div class="power-bar-label">
                <span>PODER</span>
                <span id="powerLevelText">0/6</span>
            </div>
            <div class="power-bar" id="powerBar">
                <div class="power-segment"></div>
                <div class="power-segment"></div>
                <div class="power-segment"></div>
                <div class="power-segment"></div>
                <div class="power-segment"></div>
                <div class="power-segment"></div>
            </div>
            <div class="power-info" id="powerModeInfo">SIMPLE</div>
        </div>

        <div id="difficultyMeter">
            <div style="color: white; font-size: 11px; display: flex; justify-content: space-between;">
                <span>DIFICULTAD</span>
                <span id="difficultyPercentage">0%</span>
            </div>
            <div class="difficulty-bar">
                <div class="difficulty-indicator" id="difficultyIndicator" style="left: 0%;"></div>
            </div>
        </div>

        <div class="mode-indicator" id="currentMode">SIMPLE</div>

        <div id="joystickArea">
            <div id="joystick"></div>
        </div>

        <div id="controls">
            <div class="control-btn" id="shootBtn">🔫</div>
            <div class="control-btn missile" id="missileBtn">🚀</div>
        </div>

        <div id="gameOver">
            <h2>GAME OVER</h2>
            <div id="finalScore">0</div>
            <div id="finalStats"></div>
            <button id="restartBtn">REINICIAR</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Ajustar canvas al tamaño real
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            player.x = canvas.width / 2;
            player.y = canvas.height - 70;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Elementos UI
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const missilesElement = document.getElementById('missiles');
        const powerLevelElement = document.getElementById('powerLevel');
        const powerModeInfo = document.getElementById('powerModeInfo');
        const currentMode = document.getElementById('currentMode');
        const difficultyIndicator = document.getElementById('difficultyIndicator');
        const difficultyPercentage = document.getElementById('difficultyPercentage');
        const finalScoreElement = document.getElementById('finalScore');
        const finalStatsElement = document.getElementById('finalStats');
        const restartBtn = document.getElementById('restartBtn');
        const shootBtn = document.getElementById('shootBtn');
        const missileBtn = document.getElementById('missileBtn');
        const joystick = document.getElementById('joystick');
        const joystickArea = document.getElementById('joystickArea');

        // Power bar segments
        const powerSegments = document.querySelectorAll('.power-segment');

        // Jugador
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 70,
            radius: 15,
            lives: 3,
            missiles: 0,
            powerLevel: 0,
            maxPowerLevel: 6,
            shotMode: 'simple'
        };

        // Arrays para objetos
        let asteroids = [];
        let bullets = [];
        let missiles = [];
        let powerUps = [];

        // Variables de juego
        let score = 0;
        let gameRunning = true;
        let frames = 0;
        let shooting = false;
        let missileReady = true;
        let missileCooldown = 0;
        const missileMaxCooldown = 90;

        // Control táctil
        let touchActive = false;
        let touchX = player.x;
        let joystickVector = { x: 0, y: 0 };

        // Estadísticas
        let stats = {
            maxDifficulty: 1,
            asteroidsDestroyed: 0,
            missilesLaunched: 0,
            powerUpsCollected: 0
        };

        // Configuración base
        let difficulty = {
            level: 1,
            speedMultiplier: 1.0,
            spawnRate: 35,
            asteroidCount: 1
        };

        let asteroidSpeed = 2.5;
        const baseAsteroidSpeed = 2.5;
        const asteroidSizes = [10, 15, 20, 25];
        const bulletSpeed = 8;
        const bulletRadius = 3;
        const shootCooldown = 6;
        let shootTimer = 0;
        const missileSpeed = 12;
        const missileRadius = 8;
        const missileExplosionRadius = 80;
        const powerUpSpawnRate = 250;
        const powerUpTypes = ['triple', 'missile'];
        const powerUpColors = {
            triple: '#ffaa00',
            missile: '#ff6b6b'
        };

        // Controles táctiles
        joystickArea.addEventListener('touchstart', handleTouchStart);
        joystickArea.addEventListener('touchmove', handleTouchMove);
        joystickArea.addEventListener('touchend', handleTouchEnd);
        joystickArea.addEventListener('touchcancel', handleTouchEnd);

        function handleTouchStart(e) {
            e.preventDefault();
            touchActive = true;
            updateJoystick(e.touches[0]);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (touchActive) {
                updateJoystick(e.touches[0]);
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            touchActive = false;
            joystickVector = { x: 0, y: 0 };
            joystick.style.transform = 'translate(0px, 0px)';
        }

        function updateJoystick(touch) {
            const rect = joystickArea.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            
            // Limitar al radio del joystick
            const distance = Math.sqrt(dx * dx + dy * dy);
            const maxDistance = rect.width / 2 - 25;
            
            if (distance > maxDistance) {
                dx = (dx / distance) * maxDistance;
                dy = (dy / distance) * maxDistance;
            }
            
            joystickVector.x = dx / maxDistance;
            joystickVector.y = dy / maxDistance;
            
            joystick.style.transform = `translate(${dx}px, ${dy}px)`;
        }

        // Botones táctiles
        shootBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            shooting = true;
        });
        
        shootBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            shooting = false;
        });
        
        shootBtn.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            shooting = false;
        });

        missileBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (player.missiles > 0 && missileReady && gameRunning) {
                launchMissile();
                player.missiles--;
                stats.missilesLaunched++;
                missilesElement.textContent = `🚀 ${player.missiles}`;
                missileReady = false;
                missileCooldown = missileMaxCooldown;
                
                // Feedback háptico (vibración) si está disponible
                if (navigator.vibrate) {
                    navigator.vibrate(50);
                }
            }
        });

        function updateShotMode() {
            if (player.powerLevel === 0) {
                player.shotMode = 'simple';
                currentMode.textContent = 'SIMPLE';
                currentMode.style.borderColor = '#4a6fa5';
                currentMode.style.color = '#4a6fa5';
            } else if (player.powerLevel <= 2) {
                player.shotMode = 'double';
                currentMode.textContent = 'DOBLE';
                currentMode.style.borderColor = '#00ffaa';
                currentMode.style.color = '#00ffaa';
            } else if (player.powerLevel <= 4) {
                player.shotMode = 'triple';
                currentMode.textContent = 'TRIPLE';
                currentMode.style.borderColor = '#ffaa00';
                currentMode.style.color = '#ffaa00';
            } else {
                player.shotMode = 'burst';
                currentMode.textContent = 'RÁFAGA';
                currentMode.style.borderColor = '#ff4444';
                currentMode.style.color = '#ff4444';
            }
            
            powerModeInfo.textContent = currentMode.textContent;
        }

        function addPowerLevel(amount) {
            player.powerLevel = Math.min(player.powerLevel + amount, player.maxPowerLevel);
            updatePowerUI();
        }

        function updatePowerUI() {
            powerLevelElement.textContent = `⚡ ${player.powerLevel}/${player.maxPowerLevel}`;
            document.getElementById('powerLevelText').textContent = `${player.powerLevel}/${player.maxPowerLevel}`;
            
            powerSegments.forEach((segment, index) => {
                if (index < player.powerLevel) {
                    segment.classList.add('active');
                    
                    if (player.powerLevel <= 2) {
                        segment.style.background = '#4a6fa5';
                    } else if (player.powerLevel <= 4) {
                        segment.style.background = '#ffaa00';
                    } else {
                        segment.style.background = '#ff4444';
                    }
                } else {
                    segment.classList.remove('active');
                    segment.style.background = '#4a6fa5';
                }
            });
            
            updateShotMode();
        }

        function launchMissile() {
            missiles.push({
                x: player.x,
                y: player.y - player.radius,
                radius: missileRadius,
                speed: missileSpeed,
                exploded: false
            });
        }

        function spawnPowerUp() {
            if (!gameRunning) return;
            
            const type = powerUpTypes[Math.floor(Math.random() * powerUpTypes.length)];
            const x = Math.random() * (canvas.width - 40) + 20;
            const y = -30;
            
            powerUps.push({
                x: x,
                y: y,
                radius: 15,
                type: type,
                speed: 2,
                angle: 0,
                pulse: 0
            });
        }

        function spawnAsteroid() {
            if (!gameRunning) return;
            
            const count = Math.floor(Math.random() * difficulty.asteroidCount) + 1;
            
            for (let i = 0; i < count; i++) {
                const radius = asteroidSizes[Math.floor(Math.random() * asteroidSizes.length)];
                const x = Math.random() * (canvas.width - 2 * radius) + radius;
                asteroids.push({
                    x: x,
                    y: -radius - Math.random() * 100,
                    radius: radius,
                    speed: asteroidSpeed * difficulty.speedMultiplier + Math.random() * 2
                });
            }
        }

        function shootBullet() {
            switch(player.shotMode) {
                case 'simple':
                    bullets.push({ x: player.x, y: player.y - player.radius, radius: bulletRadius, speed: bulletSpeed });
                    break;
                case 'double':
                    bullets.push({ x: player.x - 8, y: player.y - player.radius, radius: bulletRadius, speed: bulletSpeed });
                    bullets.push({ x: player.x + 8, y: player.y - player.radius, radius: bulletRadius, speed: bulletSpeed });
                    break;
                case 'triple':
                    bullets.push({ x: player.x, y: player.y - player.radius, radius: bulletRadius, speed: bulletSpeed });
                    bullets.push({ x: player.x - 12, y: player.y - player.radius + 5, radius: bulletRadius, speed: bulletSpeed });
                    bullets.push({ x: player.x + 12, y: player.y - player.radius + 5, radius: bulletRadius, speed: bulletSpeed });
                    break;
                case 'burst':
                    for (let i = -2; i <= 2; i++) {
                        bullets.push({ 
                            x: player.x + i * 10, 
                            y: player.y - player.radius - Math.abs(i) * 3, 
                            radius: bulletRadius, 
                            speed: bulletSpeed 
                        });
                    }
                    break;
            }
            
            // Vibración al disparar (solo en ráfaga)
            if (player.shotMode === 'burst' && navigator.vibrate) {
                navigator.vibrate(20);
            }
        }

        function updateDifficulty() {
            const newLevel = Math.floor(score / 500) + 1;
            
            if (newLevel !== difficulty.level) {
                difficulty.level = newLevel;
                difficulty.speedMultiplier = 1.0 + (newLevel - 1) * 0.2;
                difficulty.spawnRate = Math.max(15, 35 - (newLevel - 1) * 3);
                difficulty.asteroidCount = Math.min(3, Math.floor(newLevel / 2) + 1);
                
                asteroidSpeed = baseAsteroidSpeed * difficulty.speedMultiplier;
                
                const percentage = Math.min(100, ((newLevel - 1) * 20));
                difficultyIndicator.style.left = percentage + '%';
                difficultyPercentage.textContent = percentage + '%';
                
                stats.maxDifficulty = Math.max(stats.maxDifficulty, difficulty.level);
            }
        }

        function update() {
            if (!gameRunning) return;

            // Mover jugador con joystick
            if (touchActive) {
                player.x += joystickVector.x * 8;
                player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            }

            updateDifficulty();

            // Cooldown de misiles
            if (!missileReady) {
                missileCooldown--;
                if (missileCooldown <= 0) {
                    missileReady = true;
                }
            }

            // Disparar
            if (shooting && shootTimer <= 0) {
                shootBullet();
                shootTimer = shootCooldown;
            }
            if (shootTimer > 0) {
                shootTimer--;
            }

            // Generar objetos
            frames++;
            if (frames % Math.floor(difficulty.spawnRate) === 0) {
                spawnAsteroid();
            }
            if (frames % powerUpSpawnRate === 0) {
                spawnPowerUp();
            }

            // Mover asteroides
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const asteroid = asteroids[i];
                asteroid.y += asteroid.speed;

                if (asteroid.y - asteroid.radius > canvas.height) {
                    asteroids.splice(i, 1);
                }
            }

            // Mover balas
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.y -= bullet.speed;

                if (bullet.y + bullet.radius < 0) {
                    bullets.splice(i, 1);
                }
            }

            // Mover misiles
            for (let i = missiles.length - 1; i >= 0; i--) {
                const missile = missiles[i];
                missile.y -= missile.speed;

                if (missile.y + missile.radius < 0) {
                    missiles.splice(i, 1);
                }
            }

            // Mover potenciadores
            for (let i = powerUps.length - 1; i >= 0; i--) {
                const powerUp = powerUps[i];
                powerUp.y += powerUp.speed;
                powerUp.angle += 0.02;

                if (powerUp.y - powerUp.radius > canvas.height) {
                    powerUps.splice(i, 1);
                }
            }

            // Colisiones balas-asteroides
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const asteroid = asteroids[j];
                    const dx = bullet.x - asteroid.x;
                    const dy = bullet.y - asteroid.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < bullet.radius + asteroid.radius) {
                        bullets.splice(i, 1);
                        asteroids.splice(j, 1);
                        score += 10;
                        stats.asteroidsDestroyed++;
                        scoreElement.textContent = `🎯 ${score}`;
                        break;
                    }
                }
            }

            // Colisiones misiles-asteroides
            for (let i = missiles.length - 1; i >= 0; i--) {
                const missile = missiles[i];
                let missileExploded = false;
                
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const asteroid = asteroids[j];
                    const dx = missile.x - asteroid.x;
                    const dy = missile.y - asteroid.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < missile.radius + asteroid.radius) {
                        missileExploded = true;
                        
                        for (let k = asteroids.length - 1; k >= 0; k--) {
                            const nearbyAsteroid = asteroids[k];
                            const blastDx = missile.x - nearbyAsteroid.x;
                            const blastDy = missile.y - nearbyAsteroid.y;
                            const blastDistance = Math.sqrt(blastDx * blastDx + blastDy * blastDy);
                            
                            if (blastDistance < missileExplosionRadius + nearbyAsteroid.radius) {
                                asteroids.splice(k, 1);
                                score += 10;
                                stats.asteroidsDestroyed++;
                            }
                        }
                        
                        missiles.splice(i, 1);
                        score += 50;
                        stats.asteroidsDestroyed += 5;
                        scoreElement.textContent = `🎯 ${score}`;
                        
                        if (navigator.vibrate) {
                            navigator.vibrate(100);
                        }
                        break;
                    }
                }
                
                if (missileExploded) {
                    continue;
                }
            }

            // Colisiones jugador-potenciadores
            for (let i = powerUps.length - 1; i >= 0; i--) {
                const powerUp = powerUps[i];
                const dx = player.x - powerUp.x;
                const dy = player.y - powerUp.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < player.radius + powerUp.radius) {
                    if (powerUp.type === 'triple') {
                        addPowerLevel(1);
                        stats.powerUpsCollected++;
                        if (navigator.vibrate) {
                            navigator.vibrate(50);
                        }
                    } else if (powerUp.type === 'missile') {
                        player.missiles += 3;
                        missilesElement.textContent = `🚀 ${player.missiles}`;
                    }
                    
                    powerUps.splice(i, 1);
                }
            }

            // Colisiones jugador-asteroides
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const asteroid = asteroids[i];
                const dx = player.x - asteroid.x;
                const dy = player.y - asteroid.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < player.radius + asteroid.radius) {
                    asteroids.splice(i, 1);
                    player.lives--;
                    livesElement.textContent = `❤️ ${player.lives}`;
                    
                    if (player.powerLevel > 0) {
                        player.powerLevel = Math.max(0, player.powerLevel - 2);
                        updatePowerUI();
                    }
                    
                    if (navigator.vibrate) {
                        navigator.vibrate(200);
                    }

                    if (player.lives <= 0) {
                        gameOver();
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Fondo estrellado
            ctx.fillStyle = 'white';
            for (let i = 0; i < 50; i++) {
                const x = (Math.sin(i + frames * 0.001) * canvas.width) % canvas.width;
                const y = (Math.cos(i + frames * 0.002) * canvas.height) % canvas.height;
                ctx.fillRect(x, y, 1, 1);
            }

            // Jugador
            ctx.save();
            ctx.translate(player.x, player.y);
            
            if (player.powerLevel > 4) {
                ctx.shadowColor = '#ff4444';
                ctx.shadowBlur = 30;
            } else if (player.powerLevel > 2) {
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 20;
            } else if (player.powerLevel > 0) {
                ctx.shadowColor = '#00ffaa';
                ctx.shadowBlur = 15;
            }
            
            ctx.fillStyle = '#4a6fa5';
            ctx.beginPath();
            ctx.moveTo(0, -player.radius);
            ctx.lineTo(-player.radius, player.radius - 5);
            ctx.lineTo(0, player.radius - 10);
            ctx.lineTo(player.radius, player.radius - 5);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = player.powerLevel > 4 ? '#ff4444' : (player.powerLevel > 2 ? '#ffaa00' : '#00ffaa');
            ctx.beginPath();
            ctx.moveTo(-8, player.radius - 5);
            ctx.lineTo(0, player.radius + 5 + player.powerLevel);
            ctx.lineTo(8, player.radius - 5);
            ctx.fill();
            
            ctx.restore();

            // Asteroides
            asteroids.forEach(asteroid => {
                ctx.save();
                ctx.translate(asteroid.x, asteroid.y);
                ctx.rotate(frames * 0.01);
                
                ctx.beginPath();
                ctx.arc(0, 0, asteroid.radius, 0, Math.PI * 2);
                const speedFactor = asteroid.speed / baseAsteroidSpeed;
                ctx.fillStyle = `rgb(${100 + speedFactor * 50}, ${80 + speedFactor * 30}, ${80})`;
                ctx.fill();
                
                ctx.fillStyle = '#5a5a5a';
                ctx.beginPath();
                ctx.arc(-asteroid.radius/3, -asteroid.radius/3, asteroid.radius/4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            });

            // Balas
            bullets.forEach(bullet => {
                ctx.fillStyle = player.powerLevel > 4 ? '#ff4444' : (player.powerLevel > 2 ? '#ffaa00' : '#00ffaa');
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Misiles
            missiles.forEach(missile => {
                ctx.save();
                ctx.translate(missile.x, missile.y);
                
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.arc(0, 0, missile.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, 5);
                ctx.lineTo(0, 20);
                ctx.stroke();
                
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.moveTo(-6, 0);
                ctx.lineTo(0, 10);
                ctx.lineTo(6, 0);
                ctx.fill();
                
                ctx.restore();
            });

            // Potenciadores
            powerUps.forEach(powerUp => {
                const pulse = Math.sin(frames * 0.1) * 3;
                
                ctx.save();
                ctx.translate(powerUp.x, powerUp.y);
                ctx.rotate(powerUp.angle);
                
                ctx.shadowColor = powerUpColors[powerUp.type];
                ctx.shadowBlur = 20;
                ctx.fillStyle = powerUpColors[powerUp.type];
                ctx.beginPath();
                ctx.arc(0, 0, powerUp.radius + pulse, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 10;
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(0, 0, powerUp.radius - 3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = powerUpColors[powerUp.type];
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(powerUp.type === 'triple' ? '⚡' : '🚀', 0, 0);
                
                ctx.restore();
            });
            
            ctx.shadowBlur = 0;
        }

        function gameOver() {
            gameRunning = false;
            
            finalScoreElement.textContent = `Puntuación: ${score}`;
            finalStatsElement.innerHTML = `
                <div>Nivel máximo: ${stats.maxDifficulty}</div>
                <div>Asteroides: ${stats.asteroidsDestroyed}</div>
                <div>Misiles: ${stats.missilesLaunched}</div>
            `;
            
            gameOverElement.style.display = 'block';
            
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 200]);
            }
        }

        function restart() {
            player.lives = 3;
            player.x = canvas.width / 2;
            player.y = canvas.height - 70;
            player.missiles = 0;
            player.powerLevel = 0;
            
            asteroids = [];
            bullets = [];
            missiles = [];
            powerUps = [];
            
            score = 0;
            frames = 0;
            shootTimer = 0;
            missileReady = true;
            missileCooldown = 0;
            
            difficulty = {
                level: 1,
                speedMultiplier: 1.0,
                spawnRate: 35,
                asteroidCount: 1
            };
            asteroidSpeed = baseAsteroidSpeed;
            
            stats = {
                maxDifficulty: 1,
                asteroidsDestroyed: 0,
                missilesLaunched: 0,
                powerUpsCollected: 0
            };
            
            scoreElement.textContent = '🎯 0';
            livesElement.textContent = '❤️ 3';
            missilesElement.textContent = '🚀 0';
            difficultyIndicator.style.left = '0%';
            difficultyPercentage.textContent = '0%';
            
            updatePowerUI();
            gameRunning = true;
            gameOverElement.style.display = 'none';
        }

        // Inicializar
        updatePowerUI();
        restartBtn.addEventListener('click', restart);
        restartBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            restart();
        });

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();

        // Prevenir scroll en el móvil
        document.body.addEventListener('touchmove', (e) => {
            if (e.target.closest('#gameContainer')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
