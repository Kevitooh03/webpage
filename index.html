<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asteroides Vertical - Control por Giro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #0a0f1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            touch-action: none;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 400px;
            max-height: 800px;
            overflow: hidden;
            background: #0a0f1e;
            margin: auto;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1f2e, #0a0f1e);
            touch-action: none;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }

        .ui-left, .ui-right {
            display: flex;
            gap: 10px;
        }

        .ui-element {
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 30px;
            border: 2px solid #4a6fa5;
            backdrop-filter: blur(5px);
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #lives { border-color: #ff6b6b; }
        #missiles { border-color: #ffaa00; }
        #score { border-color: #4a6fa5; }

        #difficultyIndicator {
            position: absolute;
            top: 80px;
            left: 15px;
            right: 15px;
            height: 6px;
            background: rgba(0,0,0,0.5);
            border-radius: 3px;
            overflow: hidden;
            z-index: 10;
        }

        #difficultyFill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000);
            border-radius: 3px;
            transition: width 0.3s;
        }

        #modeIndicator {
            position: absolute;
            top: 100px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            padding: 5px 15px;
            border-radius: 20px;
            border: 2px solid #00ffaa;
            color: #00ffaa;
            font-size: 14px;
            font-weight: bold;
            backdrop-filter: blur(5px);
            z-index: 10;
            pointer-events: none;
        }

        #powerLevel {
            position: absolute;
            bottom: 30px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 30px;
            border: 2px solid #ffaa00;
            color: #ffaa00;
            font-size: 16px;
            font-weight: bold;
            backdrop-filter: blur(5px);
            z-index: 10;
            pointer-events: none;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            color: white;
            padding: 30px 20px;
            border-radius: 30px;
            text-align: center;
            display: none;
            border: 3px solid #ff6b6b;
            z-index: 30;
            box-shadow: 0 0 50px rgba(255,107,107,0.5);
            width: 85%;
            max-width: 320px;
        }

        #gameOver h2 {
            margin: 0 0 15px 0;
            color: #ff6b6b;
            font-size: 42px;
            text-shadow: 0 0 20px #ff6b6b;
        }

        #finalScore {
            font-size: 28px;
            margin-bottom: 10px;
            color: #4a6fa5;
        }

        #finalStats {
            font-size: 16px;
            margin-bottom: 25px;
            color: #aaa;
            line-height: 2;
        }

        #restartBtn {
            background: #4a6fa5;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 22px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid #6b8fc5;
            font-weight: bold;
            width: 100%;
            touch-action: manipulation;
            box-shadow: 0 8px 0 #2a3f5a;
        }

        #restartBtn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #2a3f5a;
        }

        #touchArea {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50vh;
            background: transparent;
            z-index: 15;
            touch-action: none;
        }

        #shootHint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255,107,107,0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            border: 3px solid white;
            box-shadow: 0 0 30px #ff6b6b;
            animation: pulse 1.5s infinite;
            z-index: 20;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #calibrateBtn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(74,111,165,0.9);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid white;
            z-index: 40;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #calibrateBtn:active {
            background: #6b8fc5;
            transform: scale(0.95);
        }

        #orientationWarning {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0f1e;
            color: white;
            display: none;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 100;
            font-size: 20px;
            flex-direction: column;
            gap: 20px;
        }

        @media (orientation: landscape) {
            #orientationWarning {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div id="orientationWarning">
        <div>📱 Por favor, gira tu dispositivo a vertical para jugar</div>
        <div style="font-size: 50px; margin: 20px;">↕️</div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div class="ui-left">
                <div class="ui-element" id="lives">❤️ 3</div>
                <div class="ui-element" id="missiles">🚀 0</div>
            </div>
            <div class="ui-right">
                <div class="ui-element" id="score">🎯 0</div>
            </div>
        </div>

        <div id="difficultyIndicator">
            <div id="difficultyFill"></div>
        </div>

        <div id="modeIndicator">MODO SIMPLE</div>
        <div id="powerLevel">⚡ NIVEL 0</div>

        <div id="touchArea"></div>
        <div id="shootHint">¡TOCA AQUÍ PARA DISPARAR!</div>

        <button id="calibrateBtn">🎯</button>

        <div id="gameOver">
            <h2>GAME OVER</h2>
            <div id="finalScore">Puntuación: 0</div>
            <div id="finalStats"></div>
            <button id="restartBtn">REINICIAR</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Ajustar canvas
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            player.x = canvas.width / 2;
            player.y = canvas.height - 120;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Elementos UI
        const livesElement = document.getElementById('lives');
        const missilesElement = document.getElementById('missiles');
        const scoreElement = document.getElementById('score');
        const modeIndicator = document.getElementById('modeIndicator');
        const powerLevelElement = document.getElementById('powerLevel');
        const difficultyFill = document.getElementById('difficultyFill');
        const finalScoreElement = document.getElementById('finalScore');
        const finalStatsElement = document.getElementById('finalStats');
        const restartBtn = document.getElementById('restartBtn');
        const touchArea = document.getElementById('touchArea');
        const calibrateBtn = document.getElementById('calibrateBtn');
        const shootHint = document.getElementById('shootHint');

        // Jugador
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 120,
            radius: 20,
            lives: 3,
            missiles: 0,
            powerLevel: 0,
            maxPowerLevel: 6,
            shotMode: 'simple'
        };

        // Arrays para objetos
        let asteroids = [];
        let bullets = [];
        let missiles = [];
        let powerUps = [];

        // Variables de juego
        let score = 0;
        let gameRunning = true;
        let frames = 0;
        let shooting = false;
        let missileReady = true;
        let missileCooldown = 0;
        const missileMaxCooldown = 90;

        // Control por giro
        let beta = 0; // Inclinación izquierda/derecha
        let calibratedBeta = 0;
        let deviceOrientationSupported = false;
        let calibrationOffset = 0;

        // Estadísticas
        let stats = {
            maxDifficulty: 1,
            asteroidsDestroyed: 0,
            missilesLaunched: 0,
            powerUpsCollected: 0
        };

        // Configuración base
        let difficulty = {
            level: 1,
            speedMultiplier: 1.0,
            spawnRate: 30,
            asteroidCount: 1
        };

        let asteroidSpeed = 2.5;
        const baseAsteroidSpeed = 2.5;
        const asteroidSizes = [12, 18, 24, 30];
        const bulletSpeed = 8;
        const bulletRadius = 4;
        const shootCooldown = 6;
        let shootTimer = 0;
        const missileSpeed = 12;
        const missileRadius = 10;
        const missileExplosionRadius = 90;
        const powerUpSpawnRate = 200;
        const powerUpTypes = ['triple', 'missile'];
        const powerUpColors = {
            triple: '#ffaa00',
            missile: '#ff6b6b'
        };

        // Inicializar sensores
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', handleOrientation);
            deviceOrientationSupported = true;
        }

        function handleOrientation(event) {
            if (!gameRunning) return;
            
            // beta: inclinación hacia los lados (-180 a 180)
            if (event.beta !== null) {
                beta = event.beta;
                
                // Aplicar calibración
                let calibratedBeta = beta - calibrationOffset;
                
                // Mapear la inclinación a posición en el canvas
                // Limitar a ±30 grados para control suave
                const maxTilt = 30;
                const limitedBeta = Math.max(-maxTilt, Math.min(maxTilt, calibratedBeta));
                
                // Convertir grados a posición en pantalla
                const targetX = (limitedBeta + maxTilt) / (maxTilt * 2) * canvas.width;
                
                // Movimiento suave
                player.x += (targetX - player.x) * 0.1;
                player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            }
        }

        // Calibrar posición neutral
        calibrateBtn.addEventListener('click', calibrate);
        calibrateBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            calibrate();
        });

        function calibrate() {
            calibrationOffset = beta;
            
            // Feedback visual
            calibrateBtn.style.background = '#00ffaa';
            calibrateBtn.style.transform = 'scale(1.2)';
            setTimeout(() => {
                calibrateBtn.style.background = 'rgba(74,111,165,0.9)';
                calibrateBtn.style.transform = 'scale(1)';
            }, 200);
            
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        // Disparo al tocar la pantalla
        touchArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            shooting = true;
            
            // Ocultar hint después del primer disparo
            shootHint.style.opacity = '0.5';
        });
        
        touchArea.addEventListener('touchend', (e) => {
            e.preventDefault();
            shooting = false;
        });
        
        touchArea.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            shooting = false;
        });

        function updateShotMode() {
            if (player.powerLevel === 0) {
                player.shotMode = 'simple';
                modeIndicator.textContent = 'MODO SIMPLE';
                modeIndicator.style.borderColor = '#4a6fa5';
                modeIndicator.style.color = '#4a6fa5';
            } else if (player.powerLevel <= 2) {
                player.shotMode = 'double';
                modeIndicator.textContent = 'MODO DOBLE';
                modeIndicator.style.borderColor = '#00ffaa';
                modeIndicator.style.color = '#00ffaa';
            } else if (player.powerLevel <= 4) {
                player.shotMode = 'triple';
                modeIndicator.textContent = 'MODO TRIPLE';
                modeIndicator.style.borderColor = '#ffaa00';
                modeIndicator.style.color = '#ffaa00';
            } else {
                player.shotMode = 'burst';
                modeIndicator.textContent = 'MODO RÁFAGA 🔥';
                modeIndicator.style.borderColor = '#ff4444';
                modeIndicator.style.color = '#ff4444';
            }
            
            powerLevelElement.textContent = `⚡ NIVEL ${player.powerLevel}`;
            
            // Cambiar color del nivel según poder
            if (player.powerLevel <= 2) {
                powerLevelElement.style.borderColor = '#4a6fa5';
                powerLevelElement.style.color = '#4a6fa5';
            } else if (player.powerLevel <= 4) {
                powerLevelElement.style.borderColor = '#ffaa00';
                powerLevelElement.style.color = '#ffaa00';
            } else {
                powerLevelElement.style.borderColor = '#ff4444';
                powerLevelElement.style.color = '#ff4444';
            }
        }

        function addPowerLevel(amount) {
            player.powerLevel = Math.min(player.powerLevel + amount, player.maxPowerLevel);
            updateShotMode();
        }

        function launchMissile() {
            missiles.push({
                x: player.x,
                y: player.y - player.radius,
                radius: missileRadius,
                speed: missileSpeed,
                exploded: false
            });
            
            // Disparar misil también da un pequeño feedback
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }
        }

        function spawnPowerUp() {
            if (!gameRunning) return;
            
            const type = powerUpTypes[Math.floor(Math.random() * powerUpTypes.length)];
            const x = Math.random() * (canvas.width - 40) + 20;
            const y = -30;
            
            powerUps.push({
                x: x,
                y: y,
                radius: 18,
                type: type,
                speed: 2,
                angle: 0
            });
        }

        function spawnAsteroid() {
            if (!gameRunning) return;
            
            const count = Math.floor(Math.random() * difficulty.asteroidCount) + 1;
            
            for (let i = 0; i < count; i++) {
                const radius = asteroidSizes[Math.floor(Math.random() * asteroidSizes.length)];
                const x = Math.random() * (canvas.width - 2 * radius) + radius;
                asteroids.push({
                    x: x,
                    y: -radius - Math.random() * 100,
                    radius: radius,
                    speed: asteroidSpeed * difficulty.speedMultiplier + Math.random() * 1.5
                });
            }
        }

        function shootBullet() {
            switch(player.shotMode) {
                case 'simple':
                    bullets.push({ x: player.x, y: player.y - player.radius, radius: bulletRadius, speed: bulletSpeed });
                    break;
                case 'double':
                    bullets.push({ x: player.x - 10, y: player.y - player.radius, radius: bulletRadius, speed: bulletSpeed });
                    bullets.push({ x: player.x + 10, y: player.y - player.radius, radius: bulletRadius, speed: bulletSpeed });
                    break;
                case 'triple':
                    bullets.push({ x: player.x, y: player.y - player.radius, radius: bulletRadius, speed: bulletSpeed });
                    bullets.push({ x: player.x - 15, y: player.y - player.radius + 8, radius: bulletRadius, speed: bulletSpeed });
                    bullets.push({ x: player.x + 15, y: player.y - player.radius + 8, radius: bulletRadius, speed: bulletSpeed });
                    break;
                case 'burst':
                    for (let i = -2; i <= 2; i++) {
                        bullets.push({ 
                            x: player.x + i * 12, 
                            y: player.y - player.radius - Math.abs(i) * 4, 
                            radius: bulletRadius, 
                            speed: bulletSpeed 
                        });
                    }
                    break;
            }
            
            // Vibración ligera al disparar
            if (player.shotMode === 'burst' && navigator.vibrate) {
                navigator.vibrate(15);
            }
        }

        function updateDifficulty() {
            const newLevel = Math.floor(score / 300) + 1;
            
            if (newLevel !== difficulty.level) {
                difficulty.level = newLevel;
                difficulty.speedMultiplier = 1.0 + (newLevel - 1) * 0.15;
                difficulty.spawnRate = Math.max(18, 30 - (newLevel - 1) * 2);
                difficulty.asteroidCount = Math.min(3, Math.floor(newLevel / 2) + 1);
                
                asteroidSpeed = baseAsteroidSpeed * difficulty.speedMultiplier;
                
                const percentage = Math.min(100, ((newLevel - 1) * 15));
                difficultyFill.style.width = percentage + '%';
                
                stats.maxDifficulty = Math.max(stats.maxDifficulty, difficulty.level);
            }
        }

        function update() {
            if (!gameRunning) return;

            updateDifficulty();

            // Cooldown de misiles
            if (!missileReady) {
                missileCooldown--;
                if (missileCooldown <= 0) {
                    missileReady = true;
                }
            }

            // Disparar al tocar
            if (shooting && shootTimer <= 0) {
                shootBullet();
                shootTimer = shootCooldown;
            }
            if (shootTimer > 0) {
                shootTimer--;
            }

            // Generar objetos
            frames++;
            if (frames % Math.floor(difficulty.spawnRate) === 0) {
                spawnAsteroid();
            }
            if (frames % powerUpSpawnRate === 0) {
                spawnPowerUp();
            }

            // Mover asteroides
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const asteroid = asteroids[i];
                asteroid.y += asteroid.speed;

                if (asteroid.y - asteroid.radius > canvas.height) {
                    asteroids.splice(i, 1);
                }
            }

            // Mover balas
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.y -= bullet.speed;

                if (bullet.y + bullet.radius < 0) {
                    bullets.splice(i, 1);
                }
            }

            // Mover misiles
            for (let i = missiles.length - 1; i >= 0; i--) {
                const missile = missiles[i];
                missile.y -= missile.speed;

                if (missile.y + missile.radius < 0) {
                    missiles.splice(i, 1);
                }
            }

            // Mover potenciadores
            for (let i = powerUps.length - 1; i >= 0; i--) {
                const powerUp = powerUps[i];
                powerUp.y += powerUp.speed;
                powerUp.angle += 0.02;

                if (powerUp.y - powerUp.radius > canvas.height) {
                    powerUps.splice(i, 1);
                }
            }

            // Colisiones balas-asteroides
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const asteroid = asteroids[j];
                    const dx = bullet.x - asteroid.x;
                    const dy = bullet.y - asteroid.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < bullet.radius + asteroid.radius) {
                        bullets.splice(i, 1);
                        asteroids.splice(j, 1);
                        score += 10;
                        stats.asteroidsDestroyed++;
                        scoreElement.textContent = `🎯 ${score}`;
                        break;
                    }
                }
            }

            // Colisiones misiles-asteroides
            for (let i = missiles.length - 1; i >= 0; i--) {
                const missile = missiles[i];
                let missileExploded = false;
                
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const asteroid = asteroids[j];
                    const dx = missile.x - asteroid.x;
                    const dy = missile.y - asteroid.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < missile.radius + asteroid.radius) {
                        missileExploded = true;
                        
                        // Explosión del misil
                        for (let k = asteroids.length - 1; k >= 0; k--) {
                            const nearbyAsteroid = asteroids[k];
                            const blastDx = missile.x - nearbyAsteroid.x;
                            const blastDy = missile.y - nearbyAsteroid.y;
                            const blastDistance = Math.sqrt(blastDx * blastDx + blastDy * blastDy);
                            
                            if (blastDistance < missileExplosionRadius + nearbyAsteroid.radius) {
                                asteroids.splice(k, 1);
                                score += 10;
                                stats.asteroidsDestroyed++;
                            }
                        }
                        
                        missiles.splice(i, 1);
                        score += 50;
                        stats.asteroidsDestroyed += 5;
                        scoreElement.textContent = `🎯 ${score}`;
                        
                        if (navigator.vibrate) {
                            navigator.vibrate(100);
                        }
                        break;
                    }
                }
                
                if (missileExploded) {
                    continue;
                }
            }

            // Colisiones jugador-potenciadores
            for (let i = powerUps.length - 1; i >= 0; i--) {
                const powerUp = powerUps[i];
                const dx = player.x - powerUp.x;
                const dy = player.y - powerUp.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < player.radius + powerUp.radius) {
                    if (powerUp.type === 'triple') {
                        addPowerLevel(1);
                        stats.powerUpsCollected++;
                        
                        // Ganar misiles al subir de nivel
                        if (player.powerLevel % 2 === 0) {
                            player.missiles++;
                            missilesElement.textContent = `🚀 ${player.missiles}`;
                        }
                        
                        if (navigator.vibrate) {
                            navigator.vibrate(50);
                        }
                    } else if (powerUp.type === 'missile') {
                        player.missiles += 2;
                        missilesElement.textContent = `🚀 ${player.missiles}`;
                    }
                    
                    powerUps.splice(i, 1);
                }
            }

            // Colisiones jugador-asteroides
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const asteroid = asteroids[i];
                const dx = player.x - asteroid.x;
                const dy = player.y - asteroid.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < player.radius + asteroid.radius) {
                    asteroids.splice(i, 1);
                    player.lives--;
                    livesElement.textContent = `❤️ ${player.lives}`;
                    
                    // Reducir poder al recibir daño
                    if (player.powerLevel > 0) {
                        player.powerLevel = Math.max(0, player.powerLevel - 2);
                        updateShotMode();
                    }
                    
                    if (navigator.vibrate) {
                        navigator.vibrate(200);
                    }

                    if (player.lives <= 0) {
                        gameOver();
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Fondo estrellado
            ctx.fillStyle = 'white';
            for (let i = 0; i < 30; i++) {
                const x = (Math.sin(i + frames * 0.001) * canvas.width) % canvas.width;
                const y = (Math.cos(i + frames * 0.002) * canvas.height) % canvas.height;
                ctx.fillRect(x, y, 2, 2);
            }

            // Jugador - NAVE MÁS GRANDE
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // Efecto glow según nivel
            if (player.powerLevel > 4) {
                ctx.shadowColor = '#ff4444';
                ctx.shadowBlur = 30;
            } else if (player.powerLevel > 2) {
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 20;
            } else if (player.powerLevel > 0) {
                ctx.shadowColor = '#00ffaa';
                ctx.shadowBlur = 15;
            }
            
            // Cuerpo principal
            ctx.fillStyle = '#4a6fa5';
            ctx.beginPath();
            ctx.moveTo(0, -player.radius);
            ctx.lineTo(-player.radius * 0.8, player.radius * 0.7);
            ctx.lineTo(0, player.radius * 0.4);
            ctx.lineTo(player.radius * 0.8, player.radius * 0.7);
            ctx.closePath();
            ctx.fill();
            
            // Motor
            ctx.fillStyle = player.powerLevel > 4 ? '#ff4444' : (player.powerLevel > 2 ? '#ffaa00' : '#00ffaa');
            ctx.beginPath();
            ctx.moveTo(-8, player.radius * 0.5);
            ctx.lineTo(0, player.radius * 0.9);
            ctx.lineTo(8, player.radius * 0.5);
            ctx.fill();
            
            ctx.restore();

            // Asteroides
            asteroids.forEach(asteroid => {
                ctx.save();
                ctx.translate(asteroid.x, asteroid.y);
                ctx.rotate(frames * 0.01);
                
                ctx.beginPath();
                ctx.arc(0, 0, asteroid.radius, 0, Math.PI * 2);
                const speedFactor = asteroid.speed / baseAsteroidSpeed;
                ctx.fillStyle = `rgb(${120 + speedFactor * 50}, ${90 + speedFactor * 30}, ${90})`;
                ctx.fill();
                
                // Cráteres
                ctx.fillStyle = '#5a5a5a';
                ctx.beginPath();
                ctx.arc(-asteroid.radius/3, -asteroid.radius/3, asteroid.radius/4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            });

            // Balas
            bullets.forEach(bullet => {
                ctx.fillStyle = player.powerLevel > 4 ? '#ff4444' : (player.powerLevel > 2 ? '#ffaa00' : '#00ffaa');
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Misiles
            missiles.forEach(missile => {
                ctx.save();
                ctx.translate(missile.x, missile.y);
                
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.arc(0, 0, missile.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 6);
                ctx.lineTo(0, 25);
                ctx.stroke();
                
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.moveTo(-8, 0);
                ctx.lineTo(0, 12);
                ctx.lineTo(8, 0);
                ctx.fill();
                
                ctx.restore();
            });

            // Potenciadores
            powerUps.forEach(powerUp => {
                const pulse = Math.sin(frames * 0.1) * 4;
                
                ctx.save();
                ctx.translate(powerUp.x, powerUp.y);
                ctx.rotate(powerUp.angle);
                
                ctx.shadowColor = powerUpColors[powerUp.type];
                ctx.shadowBlur = 25;
                ctx.fillStyle = powerUpColors[powerUp.type];
                ctx.beginPath();
                ctx.arc(0, 0, powerUp.radius + pulse, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 15;
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(0, 0, powerUp.radius - 4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = powerUpColors[powerUp.type];
                ctx.font = 'bold 22px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(powerUp.type === 'triple' ? '⚡' : '🚀', 0, 0);
                
                ctx.restore();
            });
            
            ctx.shadowBlur = 0;
        }

        function gameOver() {
            gameRunning = false;
            
            finalScoreElement.textContent = `Puntuación: ${score}`;
            finalStatsElement.innerHTML = `
                <div>🏆 Nivel máximo: ${stats.maxDifficulty}</div>
                <div>💥 Asteroides: ${stats.asteroidsDestroyed}</div>
                <div>🚀 Misiles: ${stats.missilesLaunched}</div>
                <div>⚡ Potenciadores: ${stats.powerUpsCollected}</div>
            `;
            
            gameOverElement.style.display = 'block';
            
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 200]);
            }
        }

        function restart() {
            player.lives = 3;
            player.x = canvas.width / 2;
            player.y = canvas.height - 120;
            player.missiles = 0;
            player.powerLevel = 0;
            
            asteroids = [];
            bullets = [];
            missiles = [];
            powerUps = [];
            
            score = 0;
            frames = 0;
            shootTimer = 0;
            missileReady = true;
            missileCooldown = 0;
            
            difficulty = {
                level: 1,
                speedMultiplier: 1.0,
                spawnRate: 30,
                asteroidCount: 1
            };
            asteroidSpeed = baseAsteroidSpeed;
            
            stats = {
                maxDifficulty: 1,
                asteroidsDestroyed: 0,
                missilesLaunched: 0,
                powerUpsCollected: 0
            };
            
            livesElement.textContent = '❤️ 3';
            missilesElement.textContent = '🚀 0';
            scoreElement.textContent = '🎯 0';
            difficultyFill.style.width = '0%';
            
            updateShotMode();
            gameRunning = true;
            gameOverElement.style.display = 'none';
            shootHint.style.opacity = '1';
            
            // Recalibrar
            setTimeout(calibrate, 500);
        }

        // Inicializar
        updateShotMode();
        restartBtn.addEventListener('click', restart);
        restartBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            restart();
        });

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();

        // Prevenir scroll
        document.body.addEventListener('touchmove', (e) => {
            if (e.target.closest('#gameContainer')) {
                e.preventDefault();
            }
        }, { passive: false });

        // Ocultar hint después de un tiempo
        setTimeout(() => {
            if (shootHint) {
                shootHint.style.transition = 'opacity 1s';
                shootHint.style.opacity = '0.3';
            }
        }, 5000);
    </script>
</body>
</html>
